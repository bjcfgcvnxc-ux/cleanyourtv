name: Build Launcher and Addon

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 1. بناء اللانشر الأساسي (CleanYourTV)
      - name: Build CleanYourTV Launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 2. بناء الإضافة (Prayer Times)
      - name: Build Prayer Times Addon
        working-directory: addons/prayer-times
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 3. رفع الملفين معاً
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-full-bundle
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            addons/prayer-times/app/build/outputs/apk/release/app-release.apk
