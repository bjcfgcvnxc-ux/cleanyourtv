name: Build Launcher and Addon

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # بناء اللانشر (يتعامل مع غياب gradlew)
      - name: Build CleanYourTV Launcher
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found in root, using system gradle..."
            gradle assembleDebug
          fi

      # بناء الإضافة (تأكدنا من وجود gradlew داخلها)
      - name: Build Prayer Times Addon
        working-directory: addons/prayer-times
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-bundle
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            addons/prayer-times/app/build/outputs/apk/release/app-release.apk
