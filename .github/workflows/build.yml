name: Build Everything

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show root directory
        run: ls -la

      - name: Find and Build all Gradle projects
        run: |
          # البحث عن أي ملف gradlew في المستودع
          find . -name "gradlew" -type f | while read -r file; do
            dir=$(dirname "$file")
            echo "=================================================="
            echo "Building project in: $dir"
            echo "=================================================="
            cd "$dir"
            chmod +x gradlew
            # محاولة البناء (Debug أو Release)
            ./gradlew assembleDebug || ./gradlew assembleRelease
            cd - > /dev/null
          done

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            **/build/outputs/apk/**/*.apk
